name: Sync fork with upstream

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync upstream
        run: gh repo sync ${{ github.repository }} --source Aikido-pentest-benchmarks/HackRSS --branch edge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
